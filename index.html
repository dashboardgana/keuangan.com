<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard VIP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        body { margin: 0; background: #0f172a; font-family: 'Segoe UI', sans-serif; color: white; overflow-x: hidden; }
        .login-page { display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        .login-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); width: 90%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .sidebar { width: 260px; height: 100vh; background: #1e293b; position: fixed; left: 0; top: 0; transition: 0.3s; z-index: 999; border-right: 1px solid rgba(255,255,255,0.1); }
        .main-content { margin-left: 260px; padding: 25px; transition: 0.3s; }
        .card-custom { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .sidebar { left: -260px; } .sidebar.active { left: 0; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div id="login-section" class="login-page">
        <div class="login-card">
            <h2 style="color: #38bdf8;" class="fw-bold">FINANCE LOGIN</h2>
            <p class="text-secondary">Masukkan Akses Admin</p>
            <input type="text" id="user" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Username">
            <input type="password" id="pass" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Password">
            <button onclick="handleLogin()" class="btn btn-info w-100 fw-bold">MASUK SEKARANG</button>
        </div>
    </div>

    <div id="dashboard-section" style="display: none;">
        <div class="sidebar" id="sidebar">
            <div class="p-4">
                <h4 class="fw-bold text-info">MY FINANCE</h4><hr>
                <button class="btn text-white w-100 text-start mb-2" onclick="showTab('home')"><i class="fa fa-home me-2"></i> Dashboard</button>
                <button class="btn text-white w-100 text-start mb-2" onclick="showTab('input')"><i class="fa fa-plus-circle me-2"></i> Input Data</button>
                <button class="btn btn-outline-danger w-100 mt-5" onclick="location.reload()">LOGOUT</button>
            </div>
        </div>

        <div class="main-content">
            <button class="btn btn-outline-info d-md-none mb-3" onclick="document.getElementById('sidebar').classList.toggle('active')"><i class="fa fa-bars"></i> MENU</button>
            
            <div id="home-tab">
                <div class="card-custom text-center" style="background: linear-gradient(45deg, #0ea5e9, #2563eb);">
                    <p class="mb-1">SALDO UTAMA</p><h1 class="fw-bold">Rp 0</h1>
                </div>
                <div class="row px-2">
                    <div class="col-6 p-1"><div class="card-custom text-center border-success">Pemasukan<h4 class="text-success">Rp 0</h4></div></div>
                    <div class="col-6 p-1"><div class="card-custom text-center border-danger">Pengeluaran<h4 class="text-danger">Rp 0</h4></div></div>
                </div>
            </div>

            <div id="input-tab" style="display:none;">
                <div class="card-custom">
                    <h5 class="fw-bold mb-3">Catat Transaksi</h5>
                    <select class="form-select bg-dark text-white border-secondary mb-2"><option>Pemasukan</option><option>Pengeluaran</option></select>
                    <input type="number" class="form-control bg-dark text-white border-secondary mb-2" placeholder="Nominal Rp">
                    <textarea class="form-control bg-dark text-white border-secondary mb-2" placeholder="Keterangan"></textarea>
                    <label class="small text-secondary">Lampiran Screenshot:</label>
                    <input type="file" class="form-control bg-dark text-white border-secondary mb-3">
                    <button class="btn btn-info w-100 fw-bold">SIMPAN DATA</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            // USERNAME: admin | PASSWORD: 123
            if(document.getElementById('user').value === "admin" && document.getElementById('pass').value === "123") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
            } else { alert("Akses Ditolak!"); }
        }
        function showTab(t) {
            document.getElementById('home-tab').style.display = t === 'home' ? 'block' : 'none';
            document.getElementById('input-tab').style.display = t === 'input' ? 'block' : 'none';
        }
    </script>
</body>
</html>
