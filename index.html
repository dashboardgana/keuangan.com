<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keuangan VIP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root {
            --gold-premium: #d4af37;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* Sidebar & Navigation */
        .sidebar { width: 240px; height: 100vh; background: #111827; position: fixed; border-right: 1px solid var(--border-color); display: none; z-index: 1000; }
        .sidebar-header { padding: 25px; font-weight: bold; color: var(--gold-premium); border-bottom: 1px solid var(--border-color); font-size: 1.2rem; letter-spacing: 2px; }
        .nav-link { color: #94a3b8; padding: 15px 25px; display: block; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: rgba(212, 175, 55, 0.1); color: var(--gold-premium); border-left: 4px solid var(--gold-premium); }
        
        .main-content { margin-left: 240px; padding: 30px; display: none; }
        
        /* Kotak Tahunan Mewah */
        .box-tahun-luxury { 
            background: linear-gradient(145deg, #1e293b, #0b0f19); 
            border-radius: 16px; padding: 20px; 
            border: 1px solid var(--border-color);
            transition: 0.3s;
        }
        .box-in { border-top: 4px solid #10b981; }
        .box-out { border-top: 4px solid #ef4444; }
        .box-net { border-top: 4px solid var(--gold-premium); }

        /* Kotak Bulanan Ramping */
        .grid-bulanan { display: flex; flex-wrap: wrap; gap: 12px; }
        .box-bulan-small { 
            background: var(--glass-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; padding: 12px; 
            width: 190px; /* Ramping tidak lebar x */
            text-align: center;
        }

        /* Riwayat Transaksi Mewah */
        .card-history {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid var(--gold-premium);
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .history-date { font-size: 0.8rem; color: #94a3b8; font-weight: bold; }
        
        .type-tag { font-size: 0.7rem; padding: 2px 10px; border-radius: 20px; font-weight: bold; text-transform: uppercase; }
        .tag-masuk { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; }
        .tag-keluar { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }

        .img-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gold-premium); cursor: pointer; }

        @media (max-width: 768px) { .sidebar { width: 100%; height: auto; position: relative; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>

    <div id="login-section" class="login-page">
        <div class="login-card">
            <h3 style="color: var(--gold-premium); font-weight: bold; letter-spacing: 2px;">FINANCE VIP</h3>
            <p class="small opacity-50 mb-4">Exclusive Access Only</p>
            <input type="text" id="user" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Username">
            <input type="password" id="pass" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Password">
            <button onclick="handleLogin()" class="btn w-100 fw-bold" style="background: var(--gold-premium); color: black;">ENTER SYSTEM</button>
        </div>
    </div>

    <div class="sidebar" id="sidebar-menu">
        <div class="sidebar-header">MY FINANCE</div>
        <div class="nav-link active" onclick="showSection('dashboard', this)"><i class="fa fa-home me-2"></i> Dashboard</div>
        <div class="nav-link" onclick="showSection('masuk', this)"><i class="fa fa-plus-circle me-2 text-success"></i> Uang Masuk</div>
        <div class="nav-link" onclick="showSection('keluar', this)"><i class="fa fa-minus-circle me-2 text-danger"></i> Uang Keluar</div>
        <div class="nav-link" onclick="showSection('rekapan', this)"><i class="fa fa-chart-line me-2 text-info"></i> Rekapan</div>
        <div class="nav-link text-danger mt-5" onclick="location.reload()"><i class="fa fa-power-off me-2"></i> Logout</div>
    </div>

    <div class="main-content" id="main-content-area">
        
        <div id="sec-dashboard" class="section-content">
            <h2 class="mb-4 fw-bold">Dashboard</h2>
            <div class="box-tahun-luxury text-center box-net" style="background: linear-gradient(135deg, #1e293b, #0f172a);">
                <p class="mb-1 opacity-75 fw-bold" style="letter-spacing: 1px;">TOTAL BALANCE</p>
                <h1 class="fw-bold display-4" id="total-saldo-display" style="color: var(--gold-premium);">Rp 0</h1>
            </div>
        </div>

        <div id="sec-masuk" class="section-content" style="display:none;">
            <h3 class="mb-4 text-success fw-bold">Input Revenue</h3>
            <div class="box-tahun-luxury">
                <div class="mb-3"><label>Tanggal</label><input type="date" id="tgl-masuk" class="form-control bg-dark text-white border-secondary"></div>
                <div class="mb-3"><label>Nominal (Rp)</label><input type="text" id="nom-masuk" class="form-control bg-dark text-white border-secondary format-ribuan"></div>
                <div class="mb-3"><label>Keterangan</label><input type="text" id="ket-masuk" class="form-control bg-dark text-white border-secondary"></div>
                <div class="mb-3"><label><i class="fa fa-file-image me-1"></i> Lampiran Bukti</label><input type="file" id="file-masuk" class="form-control bg-dark text-white border-secondary" accept="image/*"></div>
                <button onclick="simpanTransaksi('masuk')" class="btn btn-success w-100 fw-bold py-2">SIMPAN DATA MASUK</button>
            </div>
        </div>

        <div id="sec-keluar" class="section-content" style="display:none;">
            <h3 class="mb-4 text-danger fw-bold">Input Expenses</h3>
            <div class="box-tahun-luxury">
                <div class="mb-3"><label>Tanggal</label><input type="date" id="tgl-keluar" class="form-control bg-dark text-white border-secondary"></div>
                <div class="mb-3"><label>Nominal (Rp)</label><input type="text" id="nom-keluar" class="form-control bg-dark text-white border-secondary format-ribuan"></div>
                <div class="mb-3"><label>Keterangan</label><input type="text" id="ket-keluar" class="form-control bg-dark text-white border-secondary"></div>
                <div class="mb-3"><label><i class="fa fa-file-image me-1"></i> Lampiran Bukti</label><input type="file" id="file-keluar" class="form-control bg-dark text-white border-secondary" accept="image/*"></div>
                <button onclick="simpanTransaksi('keluar')" class="btn btn-danger w-100 fw-bold py-2">SIMPAN DATA KELUAR</button>
            </div>
        </div>

        <div id="sec-rekapan" class="section-content" style="display:none;">
            <h3 class="mb-4 fw-bold" style="color: var(--gold-premium); letter-spacing: 1px;">FINANCIAL REPORT 2026</h3>
            
            <div class="row mb-4">
                <div class="col-md-4 mb-3"><div class="box-tahun-luxury box-in text-center"><small class="opacity-50 fw-bold">REVENUE / YEAR</small><br><span class="h4 fw-bold text-success" id="rekap-tahun-in">Rp 0</span></div></div>
                <div class="col-md-4 mb-3"><div class="box-tahun-luxury box-out text-center"><small class="opacity-50 fw-bold">EXPENSES / YEAR</small><br><span class="h4 fw-bold text-danger" id="rekap-tahun-out">Rp 0</span></div></div>
                <div class="col-md-4 mb-3"><div class="box-tahun-luxury box-net text-center"><small class="opacity-50 fw-bold">NET PROFIT</small><br><span class="h4 fw-bold" style="color: var(--gold-premium);" id="rekap-tahun-sisa">Rp 0</span></div></div>
            </div>

            <h6 class="mb-3 text-uppercase opacity-50 small fw-bold">Monthly Recap</h6>
            <div id="container-bulanan" class="grid-bulanan mb-5"></div>

            <h6 class="mb-3 text-uppercase opacity-50 small fw-bold">Transaction History</h6>
            <div id="list-history">
                </div>
        </div>
    </div>

    <script>
        let dataTransaksi = [];

        function handleLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === "admin" && p === "123") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('sidebar-menu').style.display = 'block';
                document.getElementById('main-content-area').style.display = 'block';
            } else { alert("Login Gagal!"); }
        }

        function showSection(id, element) {
            document.querySelectorAll('.section-content').forEach(s => s.style.display = 'none');
            document.getElementById('sec-' + id).style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            element.classList.add('active');
        }

        document.querySelectorAll('.format-ribuan').forEach(input => {
            input.addEventListener('keyup', function() {
                let val = this.value.replace(/[^0-9]/g, '');
                this.value = val ? parseInt(val).toLocaleString('en-US') : '';
            });
        });

        function simpanTransaksi(tipe) {
            const tgl = document.getElementById(`tgl-${tipe}`).value;
            const nomRaw = document.getElementById(`nom-${tipe}`).value.replace(/,/g, '');
            const ket = document.getElementById(`ket-${tipe}`).value;
            const fileInput = document.getElementById(`file-${tipe}`);

            if(!tgl || !nomRaw || !ket) return alert("Mohon lengkapi data!");

            let fileData = "Gada"; 
            if (fileInput.files && fileInput.files[0]) {
                fileData = URL.createObjectURL(fileInput.files[0]);
            }

            const transaksi = {
                id: Date.now(),
                tanggal: tgl,
                tipe: tipe === 'masuk' ? 'Masuk' : 'Keluar',
                nominal: parseInt(nomRaw),
                keterangan: ket,
                bukti: fileData
            };

            dataTransaksi.push(transaksi);
            updateUI();
            
            document.getElementById(`tgl-${tipe}`).value = '';
            document.getElementById(`nom-${tipe}`).value = '';
            document.getElementById(`ket-${tipe}`).value = '';
            fileInput.value = '';
            alert("Data Berhasil Diarsipkan!");
        }

        function hapusData(id) {
            if(confirm("Hapus catatan ini secara permanen?")) {
                dataTransaksi = dataTransaksi.filter(t => t.id !== id);
                updateUI();
            }
        }

        function updateUI() {
            const listHistory = document.getElementById('list-history');
            const containerBulan = document.getElementById('container-bulanan');
            listHistory.innerHTML = '';
            containerBulan.innerHTML = '';
            
            let totalTahunIn = 0, totalTahunOut = 0;
            let rekapBulanan = {};

            dataTransaksi.sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal)).forEach(t => {
                const dateObj = new Date(t.tanggal);
                const bulanKey = dateObj.toLocaleString('id-ID', { month: 'long', year: 'numeric' });

                if(t.tipe === 'Masuk') totalTahunIn += t.nominal;
                else totalTahunOut += t.nominal;

                if (!rekapBulanan[bulanKey]) rekapBulanan[bulanKey] = { in: 0, out: 0 };
                if (t.tipe === 'Masuk') rekapBulanan[bulanKey].in += t.nominal;
                else rekapBulanan[bulanKey].out += t.nominal;

                const tagClass = t.tipe === 'Masuk' ? 'tag-masuk' : 'tag-keluar';
                const buktiHtml = t.bukti !== "Gada" ? `<img src="${t.bukti}" class="img-preview" onclick="window.open('${t.bukti}')">` : `<div class="img-preview d-flex align-items-center justify-content-center small opacity-25">X</div>`;

                // Layout Baru: Tanggal Sejajar Tipe
                listHistory.innerHTML += `
                    <div class="card-history">
                        <div class="history-header">
                            <span class="history-date"><i class="fa fa-calendar-alt me-1"></i> ${t.tanggal}</span>
                            <span class="type-tag ${tagClass}">${t.tipe}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="opacity-50 d-block">Keterangan:</small>
                                <span class="fw-bold text-white">${t.keterangan}</span>
                                <div class="mt-2 h5 fw-bold ${t.tipe === 'Masuk' ? 'text-success' : 'text-danger'}">Rp ${t.nominal.toLocaleString()}</div>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                ${buktiHtml}
                                <button onclick="hapusData(${t.id})" class="btn btn-sm btn-outline-danger border-0"><i class="fa fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });

            const sisaTahun = totalTahunIn - totalTahunOut;
            document.getElementById('rekap-tahun-in').innerText = `Rp ${totalTahunIn.toLocaleString()}`;
            document.getElementById('rekap-tahun-out').innerText = `Rp ${totalTahunOut.toLocaleString()}`;
            document.getElementById('rekap-tahun-sisa').innerText = `Rp ${sisaTahun.toLocaleString()}`;
            document.getElementById('total-saldo-display').innerText = `Rp ${sisaTahun.toLocaleString()}`;

            for (const bulan in rekapBulanan) {
                containerBulan.innerHTML += `
                    <div class="box-bulan-small">
                        <h6 class="fw-bold mb-2 text-info" style="font-size: 0.8rem;">${bulan}</h6>
                        <div class="small text-success fw-bold">In: ${rekapBulanan[bulan].in.toLocaleString()}</div>
                        <div class="small text-danger fw-bold">Out: ${rekapBulanan[bulan].out.toLocaleString()}</div>
                    </div>
                `;
            }

            if(dataTransaksi.length === 0) {
                listHistory.innerHTML = '<div class="text-center py-5 opacity-25">Belum ada riwayat transaksi</div>';
            }
        }
    </script>
</body>
</html>
